# GitHub Pages 电子书构建与发布流水线
# 触发：push 到 main（或手动触发）
# 流程：安装依赖 → 运行 book/build_web_book.py 生成 docs/ → 以 docs/ 为站点发布到 GitHub Pages
name: Build Web Book & Deploy GitHub Pages

on:
  push:
    branches: [main]
    # 书稿、合并版成品或构建脚本变更时重新构建网页版
    paths:
      - 'book/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 单实例部署：新构建会取消进行中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pillow pypandoc-binary python-docx

      - name: Build web book (docs/)
        working-directory: book
        run: python3 build_web_book.py

      - name: Verify build output
        run: |
          test -f docs/index.html
          test -f docs/toc.html
          test -f docs/searchindex.js
          test -f docs/style.css
          echo "docs/ size: $(du -sh docs | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

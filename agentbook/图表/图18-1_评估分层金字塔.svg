 style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>塔尖：端到端评估<br />私有回归集·judge 打分·人工抽样评审<br />（评结果：贴近用户感知但贵且钝）</p></span></div></foreignObject></g></g><g class="node default gate" id="my-svg-flowchart-G-3" data-look="classic" transform="translate(315, 62)"><rect class="basic label-container" style="fill:#f2f5f9 !important;stroke:#33475b !important" x="-136" y="-54" width="272" height="108"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>CI 门禁三道门<br />绝对地板线＋相对基线主闸＋安全类一票否决</p></span></div></foreignObject></g></g><g class="node default top" id="my-svg-flowchart-P-4" data-look="classic" transform="translate(486, 530)"><rect class="basic label-container" style="fill:#fdeaea !important;stroke:#c0392b !important" x="-136" y="-66" width="272" height="132"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>反模式警示：只建塔尖＝老板看板无牙齿<br />跳阶段上 judge＝绿灯下质量裸奔</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDevi
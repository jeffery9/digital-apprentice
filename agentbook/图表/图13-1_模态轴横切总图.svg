ntainer" style="fill:#fff !important;stroke:#33475b !important;stroke-width:1.4px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>L5 治理层<br />多模态评估（异构判官）· 注入防御（低信任围栏）<br />语音/图像数据合规（声纹·留存分层）</p></span></div></foreignObject></g></g><g class="node default layer" id="my-svg-flowchart-L4-1" data-look="classic" transform="translate(173, 333.5)"><rect class="basic label-container" style="fill:#fff !important;stroke:#33475b !important;stroke-width:1.4px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>L4 编排层<br />事件驱动 vs 请求-响应 · 流式衔接与打断协议<br />屏幕-动作循环的验证节拍</p></span></div></foreignObject></g></g><g class="node default layer" id="my-svg-flowchart-L3-2" data-look="classic" transform="translate(173, 546.5)"><rect class="basic label-container" style="fill:#fff !important;stroke:#33475b !important;stroke-width:1.4px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>L3 能力层<br />感知管线位置（OCR/VLM/ASR 谁在前）<br />computer use 双通道输入 · 输出校验异构</p></span></div></foreignObject></g></g><g class="node default layer" id="my-svg-flowchart-L2-3" data-look="classic" transform="translate(173, 771.5)"><rect class="basic label-container" style="fill:#fff !important;stroke:#33475b !important;stroke-width:1.4px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>L2 上下文层<br />非文本模态的表示与计价（信封尺寸）<br />模态感知的上下文预算 · IR 契约复用</p></span></div></foreignObject></g></g><g class="node default layer" id="my-svg-flowchart-L1-4" data-look="classic" transform="translate(173, 996.5)"><rect class="basic label-container" style="fill:#fff !important;stroke:#33475b !important;stroke-width:1.4px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>L1 模型层<br />L1a 支持哪些模态（能力矩阵）<br />L1b 模态驱动的路由（延迟/成本/分区硬约束）</p></span></div></foreignObject></g></g></g></g><g class="node default axis" id="my-svg-flowchart-MODAL-10" data-look="classic" transform="translate(173, 71)"><rect class="basic label-container" style="fill:#f2f5f9 !important;stroke:#c0392b !important;stroke-width:1.6px !important;stroke-dasharray:5 3 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel"><p>模态轴（空间维度：信息以什么形式进出）<br />文本 · 图像 · 文档 · 音频 · 视频 · 屏幕</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>